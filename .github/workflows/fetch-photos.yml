name: Fetch stock photos
on:
  workflow_dispatch:
  push:
    paths: ['tools/photos.json', 'tools/fetch_photos.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/fetch_photos.py
      - run: |
          git config user.name "laboura-bot"
          git config user.email "laboura-bot@users.noreply.github.com"
          git add img/cand
          git diff --cached --quiet || git commit -m "Add candidate stock photos [skip ci]"
          git push
